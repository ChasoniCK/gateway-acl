name: check
on: [push, pull_request]

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: panel.py --selftest
        run: python3 panel.py --selftest
      - name: install.sh syntax
        run: bash -n install.sh
      - name: shellcheck
        run: shellcheck install.sh
      # Every install compares its own VERSION against the newest tag here. If
      # a tag ships with the constant left behind, that install decides it is
      # out of date and says so until the end of time.
      - name: VERSION matches the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          ver=$(python3 -c 'import panel; print(panel.VERSION)')
          if [ "$tag" != "$ver" ]; then
            echo "tag v$tag, but panel.py says VERSION = $ver" >&2
            exit 1
          fi

  ruleset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: the real nft accepts the generated ruleset
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          mkdir -p etc
          cat > etc/config.json <<'JSON'
          {"iface":"eth0","lan":"192.168.1.0/24","self_ip":"192.168.1.10","port":8080}
          JSON
          cat > etc/devices.json <<'JSON'
          [{"ip":"192.168.1.51","name":"a","on":true},
           {"ip":"192.168.1.52","name":"b","on":false},
           {"ip":"192.168.1.53","name":"c","on":true,"vpn":false}]
          JSON
          GWACL_DIR=etc python3 panel.py --dump | sudo nft -c -f -
